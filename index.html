<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arena PvP Shooter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; }

  /* --- HUD --- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 10; }

  #crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(255,255,255,0.85);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  #hitmarker {
    position: absolute; top: 50%; left: 50%; width: 24px; height: 24px;
    transform: translate(-50%, -50%) rotate(45deg);
    opacity: 0; pointer-events: none;
  }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; background: #ff3b3b; }
  #hitmarker::before { left: 50%; top: 0; width: 3px; height: 100%; transform: translateX(-50%); }
  #hitmarker::after { top: 50%; left: 0; height: 3px; width: 100%; transform: translateY(-50%); }
  #hitmarker.show { animation: hitflash 0.15s ease-out; }
  #hitmarker.kill::before, #hitmarker.kill::after { background: #ffcc33; }
  @keyframes hitflash { 0% { opacity: 1; transform: translate(-50%,-50%) rotate(45deg) scale(1.4); } 100% { opacity: 0; transform: translate(-50%,-50%) rotate(45deg) scale(1); } }

  #damageFlash {
    position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(255,0,0,0.45) 100%);
    opacity: 0; transition: opacity 0.15s ease-out;
  }
  #damageFlash.show { opacity: 1; transition: none; }

  #statBar { position: absolute; left: 20px; bottom: 20px; width: 260px; }
  .barLabel { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; margin-bottom: 4px; text-shadow: 0 1px 2px #000; }
  .barBg { width: 100%; height: 16px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); margin-bottom: 12px; }
  .barFill { height: 100%; transition: width 0.15s ease-out; }
  #healthFill { background: linear-gradient(90deg, #ff3b3b, #ff7a3b); width: 100%; }
  #ammoText { font-size: 22px; font-weight: bold; text-shadow: 0 1px 3px #000; letter-spacing: 1px; }
  #reloadText { font-size: 13px; color: #ffcc55; margin-top: 2px; visibility: hidden; text-shadow: 0 1px 2px #000; }

  #kdBox { position: absolute; top: 20px; right: 20px; text-align: right; text-shadow: 0 1px 3px #000; }
  #killsVal { font-size: 30px; font-weight: bold; }
  #kdLabel { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }
  #deathsVal { font-size: 14px; opacity: 0.75; margin-top: 2px; }

  #killFeed {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 4px; align-items: center;
  }
  .killFeedEntry {
    background: rgba(0,0,0,0.55); padding: 5px 12px; border-radius: 3px;
    font-size: 13px; white-space: nowrap; opacity: 0; transform: translateY(-8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .killFeedEntry.show { opacity: 1; transform: translateY(0); }
  .killFeedEntry .fragger { color: #6cf; font-weight: 600; }
  .killFeedEntry .fragged { color: #ff8080; font-weight: 600; }

  #scoreboard {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(10,12,18,0.9); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 14px 18px; min-width: 260px;
    visibility: hidden; opacity: 0; transition: opacity 0.15s ease;
  }
  #scoreboard.show { visibility: visible; opacity: 1; }
  #scoreboard h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; margin-bottom: 10px; text-align: center; }
  #scoreboard table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #scoreboard th { text-align: left; opacity: 0.6; font-weight: normal; font-size: 11px; text-transform: uppercase; padding-bottom: 6px; }
  #scoreboard td { padding: 3px 0; }
  #scoreboard td.num { text-align: right; }
  #scoreboard tr.me { color: #6cf; }

  /* --- Overlays --- */
  #overlay {
    position: fixed; inset: 0; background: rgba(10,10,15,0.9); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; z-index: 20;
  }
  #overlay h1 { font-size: 42px; margin-bottom: 10px; letter-spacing: 2px; }
  #overlay p { font-size: 15px; opacity: 0.85; margin: 4px 0; max-width: 480px; line-height: 1.5; }
  #overlay .key { display: inline-block; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); border-radius: 4px; padding: 1px 7px; margin: 0 2px; font-family: monospace; }
  #nameInput {
    margin-top: 22px; font-size: 16px; padding: 8px 14px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); color: #fff;
    text-align: center; width: 220px;
  }
  #nameInput:focus { outline: 2px solid #6cf; }
  #startBtn {
    margin-top: 16px; font-size: 18px; padding: 10px 28px; border-radius: 4px;
    border: none; background: #6cf; color: #04111a; font-weight: bold; cursor: pointer;
    letter-spacing: 1px;
  }
  #startBtn:hover { background: #8dd8ff; }
  #overlay.hidden { display: none; }
</style>
</head>
<body>

<div id="hud">
  <div id="crosshair"></div>
  <div id="hitmarker"></div>
  <div id="damageFlash"></div>

  <div id="statBar">
    <div class="barLabel">Health</div>
    <div class="barBg"><div class="barFill" id="healthFill"></div></div>
    <div id="ammoText">12 / 12</div>
    <div id="reloadText">RELOADING...</div>
  </div>

  <div id="kdBox">
    <div id="killsVal">0</div>
    <div id="kdLabel">Kills</div>
    <div id="deathsVal">0 deaths</div>
  </div>

  <div id="killFeed"></div>

  <div id="scoreboard">
    <h3>Scoreboard</h3>
    <table>
      <thead><tr><th>Player</th><th class="num">K</th><th class="num">D</th></tr></thead>
      <tbody id="scoreboardBody"></tbody>
    </table>
  </div>
</div>

<div id="overlay">
  <h1>ARENA PVP</h1>
  <p><span class="key">W A S D</span> move &nbsp; <span class="key">MOUSE</span> look &nbsp; <span class="key">SPACE</span> jump</p>
  <p><span class="key">LEFT CLICK</span> shoot &nbsp; <span class="key">R</span> reload &nbsp; <span class="key">TAB</span> scoreboard</p>
  <p>Everyone in this room is an opponent. Last hits win.</p>
  <input id="nameInput" type="text" maxlength="16" placeholder="Your name">
  <button id="startBtn">START</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";
// If you export models from Blockbench/Blender as .glb, use this loader to swap
// them in for the primitive geometry below. See the README for how.
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { initializeApp } from "firebase/app";
import {
  getDatabase, ref, set, update, remove, push, onValue, onChildAdded,
  onDisconnect, serverTimestamp, increment, query, limitToLast
} from "firebase/database";

/* ============================================================
   FIREBASE SETUP
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCAzhR53W2LRZzGpPj2I5qF65Pb1SzdpRs",
  authDomain: "yt-video-editor-6db87.firebaseapp.com",
  databaseURL: "https://yt-video-editor-6db87-default-rtdb.firebaseio.com",
  projectId: "yt-video-editor-6db87",
  storageBucket: "yt-video-editor-6db87.firebasestorage.app",
  messagingSenderId: "667332883360",
  appId: "1:667332883360:web:309f73038049af5614aac5",
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

const ROOM_ID = "arena1"; // change this to run separate matches
const playerId = "p_" + Math.random().toString(36).slice(2, 10);
const playerRef = ref(db, `rooms/${ROOM_ID}/players/${playerId}`);
const roomPlayersRef = ref(db, `rooms/${ROOM_ID}/players`);
const myIncomingHitsRef = ref(db, `rooms/${ROOM_ID}/players/${playerId}/incomingHits`);
const killfeedRef = ref(db, `rooms/${ROOM_ID}/killfeed`);
const killfeedQuery = query(killfeedRef, limitToLast(5));

let myName = "Player" + Math.floor(1000 + Math.random() * 9000);

/* ============================================================
   SCENE / RENDERER / CAMERA
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0d14);
scene.fog = new THREE.Fog(0x0a0d14, 15, 60);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   LIGHTING
   ============================================================ */
scene.add(new THREE.AmbientLight(0x8899aa, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(20, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
scene.add(sun);

/* ============================================================
   ARENA
   Swap-in point: replace these primitive meshes with a GLTF level
   exported from Blockbench/Blender. Keep the same collision arrays
   (obstacles) updated with matching box bounds if you do.
   ============================================================ */
const ARENA_SIZE = 40;

const groundMat = new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.95 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(ARENA_SIZE, 40, 0x444a58, 0x1c1f28);
grid.position.y = 0.01;
scene.add(grid);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4152, roughness: 0.9 });
const wallHeight = 6;
function makeWall(w, h, d, x, y, z) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
  wall.position.set(x, y, z);
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
  return wall;
}
const half = ARENA_SIZE / 2;
makeWall(ARENA_SIZE, wallHeight, 1, 0, wallHeight / 2, -half);
makeWall(ARENA_SIZE, wallHeight, 1, 0, wallHeight / 2, half);
makeWall(1, wallHeight, ARENA_SIZE, -half, wallHeight / 2, 0);
makeWall(1, wallHeight, ARENA_SIZE, half, wallHeight / 2, 0);

// Obstacles: used for both rendering AND collision (see `obstacles` array)
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x556075, roughness: 0.8 });
const obstacles = []; // { x, z, halfW, halfD }
function addObstacle(w, h, d, x, z) {
  const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), obstacleMat);
  box.position.set(x, h / 2, z);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);
  obstacles.push({ x, z, halfW: w / 2 + 0.4, halfD: d / 2 + 0.4 });
}
addObstacle(3, 2, 3, 8, 5);
addObstacle(3, 3, 3, -8, -6);
addObstacle(2, 2.5, 6, 0, -12);
addObstacle(4, 2, 2, -12, 8);
addObstacle(2, 4, 2, 12, -14);

// Spawn points, spread around the arena away from the center firefight
const SPAWN_POINTS = [
  [14, 14], [-14, 14], [14, -14], [-14, -14],
  [0, 16], [0, -16], [16, 0], [-16, 0],
];
function randomSpawnPoint() {
  const [x, z] = SPAWN_POINTS[Math.floor(Math.random() * SPAWN_POINTS.length)];
  return new THREE.Vector3(x, 0, z);
}

/* ============================================================
   PLAYER (local)
   ============================================================ */
const PLAYER_HEIGHT = 1.7;
const PLAYER_RADIUS = 0.4;
camera.position.copy(randomSpawnPoint()).setY(PLAYER_HEIGHT);

const controls = new PointerLockControls(camera, renderer.domElement);

// --- Weapon view-model (pistol.glb) ---
// Parenting this to `camera` is what "locks" it to a fixed spot on screen —
// it will never need its own position set relative to the world, only
// relative to the camera.
const gunGroup = new THREE.Group();
gunGroup.position.set(0.4, -1.38, -0.1);
gunGroup.rotation.set(0, -0.008, 0);
gunGroup.scale.set(1, 1, 1);
camera.add(gunGroup);
scene.add(camera);

let gunMixer = null;
let shootAction = null;
const gltfLoader = new GLTFLoader();
gltfLoader.load(
  "models/pistol.glb",
  (gltf) => {
    const model = gltf.scene;
    gunGroup.add(model);
    if (gltf.animations.length > 0) {
      gunMixer = new THREE.AnimationMixer(model);
      shootAction = gunMixer.clipAction(gltf.animations.find(a => a.name === "shoot") || gltf.animations[0]);
      shootAction.setLoop(THREE.LoopOnce);
      shootAction.clampWhenFinished = true;
    }
    // Diagnostics: confirms the file loaded and tells you its real size,
    // so you can tell "wrong position" apart from "didn't load at all".
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    console.log("[pistol.glb] loaded OK. Bounding box size:", size, "— if this looks huge/tiny, that's a scale issue, not a load failure.");
  },
  undefined,
  (err) => {
    console.error("[pistol.glb] FAILED TO LOAD:", err);
    showLoadError("models/pistol.glb");
  }
);

function showLoadError(path) {
  const el = document.createElement("div");
  el.style.cssText = "position:fixed;top:10px;left:10px;background:#a00;color:#fff;padding:10px 14px;font:13px monospace;z-index:999;border-radius:4px;max-width:400px;";
  el.textContent = `⚠ Failed to load ${path} — check that the file exists at that exact path/case in your repo (open browser console for the real error).`;
  document.body.appendChild(el);
}

/* ============================================================
   GUN POSITION DEBUG TOOL
   Press ` (backtick) to toggle. Press \ to switch between editing
   the hip-fire pose and the aim-down-sights pose (forces aim on
   while editing that one, so you can see it live).
     I/K = forward/back   J/L = left/right   U/O = up/down
     , / . = rotate Y      [ / ] = scale down/up
   Current values print to the on-screen panel AND the console
   every time you adjust something.
   ============================================================ */
let gunDebug = false;
let debugEditingAim = false;
const gunDebugEl = document.createElement("div");
gunDebugEl.style.cssText = "position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,0.75);color:#6f6;padding:10px 14px;font:12px monospace;z-index:999;border-radius:4px;white-space:pre;display:none;";
document.body.appendChild(gunDebugEl);

function refreshGunDebugPanel() {
  const pose = debugEditingAim ? gunAimPose : gunHipPose;
  const text =
`GUN DEBUG (\` to hide, \\ to switch pose)
editing: ${debugEditingAim ? "AIM" : "HIP"}
pos: ${pose.position.x.toFixed(3)}, ${pose.position.y.toFixed(3)}, ${pose.position.z.toFixed(3)}
rotY: ${pose.rotY.toFixed(3)}
scale: ${pose.scale.toFixed(3)}
I/K fwd-back  J/L left-right  U/O up-down
, / . rotate   [ / ] scale`;
  gunDebugEl.textContent = text;
  console.log(text.replace(/\n/g, " | "));
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Backquote") {
    gunDebug = !gunDebug;
    gunDebugEl.style.display = gunDebug ? "block" : "none";
    if (!gunDebug) isAiming = false; // release forced-aim preview on exit
    if (gunDebug) refreshGunDebugPanel();
    return;
  }
  if (!gunDebug) return;
  if (e.code === "Backslash") {
    debugEditingAim = !debugEditingAim;
    isAiming = debugEditingAim; // force the aim pose visible while you tune it
    refreshGunDebugPanel();
    return;
  }
  const pose = debugEditingAim ? gunAimPose : gunHipPose;
  const STEP = 0.02, ROT_STEP = 0.05, SCALE_STEP = 0.05;
  switch (e.code) {
    case "KeyI": pose.position.z -= STEP; break;
    case "KeyK": pose.position.z += STEP; break;
    case "KeyJ": pose.position.x -= STEP; break;
    case "KeyL": pose.position.x += STEP; break;
    case "KeyU": pose.position.y += STEP; break;
    case "KeyO": pose.position.y -= STEP; break;
    case "Comma": pose.rotY -= ROT_STEP; break;
    case "Period": pose.rotY += ROT_STEP; break;
    case "BracketLeft": pose.scale *= (1 - SCALE_STEP); break;
    case "BracketRight": pose.scale *= (1 + SCALE_STEP); break;
    default: return;
  }
  refreshGunDebugPanel();
});

const muzzleLight = new THREE.PointLight(0xffcc66, 0, 6);
muzzleLight.position.set(0.28, -0.24, -1.1);
camera.add(muzzleLight);

const player = {
  velocity: new THREE.Vector3(),
  onGround: true,
  health: 100,
  maxHealth: 100,
  alive: true,
  kills: 0,
  deaths: 0,
};

const move = { forward: false, back: false, left: false, right: false };
let canJump = true;

const GRAVITY = 22;
const JUMP_SPEED = 8;
const WALK_SPEED = 7;

/* ============================================================
   OTHER PLAYERS (remote, rendered + used as shoot targets)
   ============================================================ */
const otherPlayers = new Map(); // id -> { mesh, mixer, walkAction, targetPos, targetRotY, lastPos, name, kills, deaths }
const latestPlayerStates = new Map(); // id -> raw db state, for name/kill lookups
let playerModelTemplate = null;
let playerWalkClip = null;
const playerGltfLoader = new GLTFLoader();
playerGltfLoader.load(
  "models/player.glb",
  (gltf) => {
    playerModelTemplate = gltf.scene;
    playerWalkClip = gltf.animations.find(a => a.name === "walking") || gltf.animations[0] || null;
    console.log("[player.glb] loaded OK.", gltf.animations.length, "animation(s) found.");
  },
  undefined,
  (err) => {
    console.error("[player.glb] FAILED TO LOAD:", err);
    showLoadError("models/player.glb");
  }
);

function createOtherPlayerMesh() {
  const group = new THREE.Group();
  let mixer = null, walkAction = null;
  if (playerModelTemplate) {
    // Non-skinned Blockbench rigs (bone hierarchy via parented nodes, no
    // <skin>) clone safely with a plain deep clone — no SkeletonUtils needed.
    const model = playerModelTemplate.clone(true);
    group.add(model);
    if (playerWalkClip) {
      mixer = new THREE.AnimationMixer(model);
      walkAction = mixer.clipAction(playerWalkClip);
      walkAction.play();
      walkAction.paused = true; // starts idle; unpaused when they're moving
    }
  } else {
    // fallback box in case the model hasn't finished loading yet when a
    // remote player first appears
    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.4, 1.1, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a90e2, roughness: 0.6 })
    );
    body.position.y = 0.95;
    body.castShadow = true;
    group.add(body);
  }
  return { mesh: group, mixer, walkAction };
}

let mpJoined = false;
function joinMultiplayer() {
  onDisconnect(playerRef).remove();
  set(playerRef, {
    x: camera.position.x, y: camera.position.y, z: camera.position.z,
    rotY: camera.rotation.y, health: player.health,
    name: myName, kills: player.kills, deaths: player.deaths,
    joinedAt: serverTimestamp(),
  });
  mpJoined = true;
}

onValue(roomPlayersRef, (snapshot) => {
  const data = snapshot.val() || {};
  const seenIds = new Set();
  latestPlayerStates.clear();

  for (const [id, state] of Object.entries(data)) {
    latestPlayerStates.set(id, state);
    if (id === playerId) continue;
    seenIds.add(id);
    let entry = otherPlayers.get(id);
    if (!entry) {
      const built = createOtherPlayerMesh();
      built.mesh.userData.playerId = id;
      scene.add(built.mesh);
      entry = {
        mesh: built.mesh, mixer: built.mixer, walkAction: built.walkAction,
        targetPos: new THREE.Vector3(state.x ?? 0, 0, state.z ?? 0), targetRotY: 0,
        lastPos: new THREE.Vector3(state.x ?? 0, 0, state.z ?? 0),
      };
      entry.mesh.position.copy(entry.targetPos);
      otherPlayers.set(id, entry);
    }
    entry.targetPos.set(state.x ?? 0, 0, state.z ?? 0);
    entry.targetRotY = state.rotY ?? 0;
    entry.name = state.name ?? "Player";
    entry.kills = state.kills ?? 0;
    entry.deaths = state.deaths ?? 0;
  }

  for (const id of Array.from(otherPlayers.keys())) {
    if (!seenIds.has(id)) {
      const entry = otherPlayers.get(id);
      scene.remove(entry.mesh);
      otherPlayers.delete(id);
    }
  }

  updateScoreboardUI();
});

let lastNetUpdate = 0;
const NET_UPDATE_INTERVAL = 0.1; // seconds, ~10Hz
function updateMultiplayer(delta) {
  for (const entry of otherPlayers.values()) {
    entry.mesh.position.lerp(entry.targetPos, Math.min(1, delta * 10));
    entry.mesh.rotation.y += (entry.targetRotY - entry.mesh.rotation.y) * Math.min(1, delta * 10);

    if (entry.walkAction) {
      const movedDist = entry.mesh.position.distanceTo(entry.lastPos);
      entry.walkAction.paused = movedDist < 0.005; // idle if barely moving
      entry.lastPos.copy(entry.mesh.position);
    }
    if (entry.mixer) entry.mixer.update(delta);
  }

  if (gunMixer) gunMixer.update(delta);

  if (!mpJoined || !player.alive) return;
  lastNetUpdate += delta;
  if (lastNetUpdate >= NET_UPDATE_INTERVAL) {
    lastNetUpdate = 0;
    update(playerRef, {
      x: camera.position.x, y: camera.position.y, z: camera.position.z,
      rotY: camera.rotation.y, health: player.health,
    });
  }
}

/* ============================================================
   INCOMING HITS — this client is authoritative over its OWN health.
   Other players report hits here; we apply the damage ourselves and
   credit the kill back to them if it's fatal. This avoids two clients
   racing to write the same health value.
   ============================================================ */
onChildAdded(myIncomingHitsRef, (snapshot) => {
  const hit = snapshot.val();
  if (!hit || !player.alive) { remove(snapshot.ref); return; }

  const shooterState = latestPlayerStates.get(hit.shooterId);
  const shooterName = shooterState?.name || hit.shooterName || "Someone";

  damagePlayer(hit.damage || 25, shooterName, hit.shooterId);
  remove(snapshot.ref); // mark processed
});

/* ============================================================
   KILL FEED
   ============================================================ */
const killFeedEl = document.getElementById("killFeed");
onChildAdded(killfeedQuery, (snapshot) => {
  const entry = snapshot.val();
  if (!entry) return;
  addKillFeedEntry(entry.fraggerName, entry.fraggedName);
});

function addKillFeedEntry(fraggerName, fraggedName) {
  const el = document.createElement("div");
  el.className = "killFeedEntry";
  el.innerHTML = `<span class="fragger">${escapeHtml(fraggerName)}</span> eliminated <span class="fragged">${escapeHtml(fraggedName)}</span>`;
  killFeedEl.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 4000);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ============================================================
   SCOREBOARD (Tab to toggle)
   ============================================================ */
const scoreboardEl = document.getElementById("scoreboard");
const scoreboardBody = document.getElementById("scoreboardBody");
let scoreboardVisible = false;

function updateScoreboardUI() {
  const rows = [{ id: playerId, name: myName, kills: player.kills, deaths: player.deaths }];
  for (const [id, entry] of otherPlayers.entries()) {
    rows.push({ id, name: entry.name, kills: entry.kills, deaths: entry.deaths });
  }
  rows.sort((a, b) => b.kills - a.kills);
  scoreboardBody.innerHTML = rows.map(r =>
    `<tr class="${r.id === playerId ? "me" : ""}"><td>${escapeHtml(r.name)}</td><td class="num">${r.kills}</td><td class="num">${r.deaths}</td></tr>`
  ).join("");
}

/* ============================================================
   INPUT
   ============================================================ */
const overlay = document.getElementById("overlay");
const nameInput = document.getElementById("nameInput");
const startBtn = document.getElementById("startBtn");
nameInput.value = myName;

startBtn.addEventListener("click", () => {
  const typed = nameInput.value.trim();
  if (typed) myName = typed.slice(0, 16);
  if (!controls.isLocked) controls.lock();
});
nameInput.addEventListener("keydown", (e) => {
  if (e.code === "Enter") startBtn.click();
});

controls.addEventListener("lock", () => {
  overlay.classList.add("hidden");
  if (!mpJoined) joinMultiplayer();
  else update(playerRef, { name: myName });
});
controls.addEventListener("unlock", () => {
  if (player.alive) overlay.classList.remove("hidden");
});

document.addEventListener("keydown", (e) => {
  switch (e.code) {
    case "KeyW": move.forward = true; break;
    case "KeyS": move.back = true; break;
    case "KeyA": move.left = true; break;
    case "KeyD": move.right = true; break;
    case "Space":
      if (canJump && player.onGround) {
        player.velocity.y = JUMP_SPEED;
        player.onGround = false;
        canJump = false;
      }
      break;
    case "KeyR": startReload(); break;
    case "Tab":
      e.preventDefault();
      scoreboardVisible = true;
      scoreboardEl.classList.add("show");
      break;
  }
});
document.addEventListener("keyup", (e) => {
  switch (e.code) {
    case "KeyW": move.forward = false; break;
    case "KeyS": move.back = false; break;
    case "KeyA": move.left = false; break;
    case "KeyD": move.right = false; break;
    case "Space": canJump = true; break;
    case "Tab":
      scoreboardVisible = false;
      scoreboardEl.classList.remove("show");
      break;
  }
});

document.addEventListener("mousedown", (e) => {
  if (e.button === 0 && controls.isLocked) shoot();
  if (e.button === 2 && controls.isLocked) isAiming = true;
});
document.addEventListener("mouseup", (e) => {
  if (e.button === 2) isAiming = false;
});
// stop the browser's right-click menu from popping up while playing
renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

/* ============================================================
   AIM DOWN SIGHTS (hold right click)
   Blends the gun toward a centered "aim" pose, zooms the camera FOV
   in, and slows movement — then eases all three back on release.
   The aim pose starts as a guess relative to your tuned hip-fire
   position; use the debug tool's "aim" mode (press \\ to switch which
   pose it's editing) to dial it in the same way you did the hip pose.
   ============================================================ */
let isAiming = false;
let aimBlend = 0; // 0 = hip, 1 = fully aimed
const ADS_BLEND_SPEED = 9;
const HIP_FOV = 75;
const AIM_FOV = 52;
const AIM_SPEED_MULTIPLIER = 0.55;

const gunHipPose = { position: new THREE.Vector3(0.4, -1.38, -0.1), rotY: -0.008, scale: 1 };
const gunAimPose = { position: new THREE.Vector3(0, -1.34, 0.05), rotY: 0, scale: 1 };

/* ============================================================
   GUN RECOIL KICK (aim-fire only)
   Unlike the baked "shoot" clip (which we skip while aiming — see
   shoot()), this is a small procedural kick applied to the gun's
   own transform: it pushes straight back and tilts the muzzle up
   for an instant, then eases back to whatever hip/aim pose it's
   already blended to. The camera never moves.
   Applied AFTER updateAimDownSights() sets the base pose each
   frame, as a simple additive offset — so it naturally rides on
   top of the hip/aim blend without fighting it.
   ============================================================ */
let gunKickZ = 0;    // current backward push (added to gunGroup.position.z)
let gunKickRotX = 0; // current muzzle-up tilt (added to gunGroup.rotation.x)
const GUN_KICK_PUSH = 0.035;  // world units — subtle
const GUN_KICK_TILT = 0.09;   // radians — subtle
const GUN_KICK_RETURN_SPEED = 10; // higher = snaps back faster

function applyGunRecoilKick() {
  gunKickZ += GUN_KICK_PUSH;
  gunKickRotX += GUN_KICK_TILT;
}
function updateGunRecoilKick(delta) {
  gunKickZ -= gunKickZ * Math.min(1, GUN_KICK_RETURN_SPEED * delta);
  gunKickRotX -= gunKickRotX * Math.min(1, GUN_KICK_RETURN_SPEED * delta);
  gunGroup.position.z += gunKickZ;
  gunGroup.rotation.x += gunKickRotX;
}

function updateAimDownSights(delta) {
  const target = isAiming ? 1 : 0;
  aimBlend += (target - aimBlend) * Math.min(1, ADS_BLEND_SPEED * delta);

  gunGroup.position.lerpVectors(gunHipPose.position, gunAimPose.position, aimBlend);
  gunGroup.rotation.set(0, gunHipPose.rotY + (gunAimPose.rotY - gunHipPose.rotY) * aimBlend, 0);
  const s = gunHipPose.scale + (gunAimPose.scale - gunHipPose.scale) * aimBlend;
  gunGroup.scale.setScalar(s);

  const fov = HIP_FOV + (AIM_FOV - HIP_FOV) * aimBlend;
  if (Math.abs(camera.fov - fov) > 0.01) {
    camera.fov = fov;
    camera.updateProjectionMatrix();
  }

  updateGunRecoilKick(delta); // applied after the base pose is set above
}

function currentMoveSpeed() {
  return WALK_SPEED * (1 - aimBlend * (1 - AIM_SPEED_MULTIPLIER));
}

/* ============================================================
   AUDIO (simple synthesized SFX, no external files needed)
   ============================================================ */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, duration, type, volume) {
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}
function sfxShoot() { playTone(180, 0.08, "square", 0.15); }
function sfxEmpty() { playTone(90, 0.1, "square", 0.1); }
function sfxHit() { playTone(600, 0.06, "triangle", 0.12); }
function sfxKill() { playTone(300, 0.2, "sawtooth", 0.15); }
function sfxHurt() { playTone(120, 0.15, "sawtooth", 0.15); }
function sfxReload() { playTone(400, 0.12, "sine", 0.1); }

/* ============================================================
   WEAPON
   ============================================================ */
const weapon = { mag: 12, magSize: 12, reloading: false, fireCooldown: 0, fireRate: 0.18 };
const raycaster = new THREE.Raycaster();
const hitmarkerEl = document.getElementById("hitmarker");
const ammoText = document.getElementById("ammoText");
const reloadText = document.getElementById("reloadText");

function updateAmmoUI() {
  ammoText.textContent = `${weapon.mag} / ${weapon.magSize}`;
}

function startReload() {
  if (weapon.reloading || weapon.mag === weapon.magSize || !player.alive) return;
  weapon.reloading = true;
  reloadText.style.visibility = "visible";
  sfxReload();
  setTimeout(() => {
    weapon.mag = weapon.magSize;
    weapon.reloading = false;
    reloadText.style.visibility = "hidden";
    updateAmmoUI();
  }, 1100);
}

const WEAPON_DAMAGE = 25; // 4 hits to kill at full health

function shoot() {
  if (weapon.fireCooldown > 0 || weapon.reloading || !player.alive) return;
  if (weapon.mag <= 0) { sfxEmpty(); startReload(); return; }

  weapon.mag--;
  weapon.fireCooldown = weapon.fireRate;
  updateAmmoUI();
  sfxShoot();

  muzzleLight.intensity = 3.5;
  setTimeout(() => { muzzleLight.intensity = 0; }, 60);

  if (shootAction && !isAiming) { shootAction.reset(); shootAction.play(); }
  if (isAiming) applyGunRecoilKick();

  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const targetGroups = Array.from(otherPlayers.values()).map(e => e.mesh);
  const hits = raycaster.intersectObjects(targetGroups, true); // recursive: rig has nested body-part meshes

  if (hits.length > 0) {
    // walk up from whatever body part was hit to the tagged root group
    let obj = hits[0].object;
    while (obj && obj.userData.playerId === undefined) obj = obj.parent;
    const targetId = obj ? obj.userData.playerId : null;
    if (targetId) {
      // Report the hit; the target's own client applies the damage.
      push(ref(db, `rooms/${ROOM_ID}/players/${targetId}/incomingHits`), {
        damage: WEAPON_DAMAGE, shooterId: playerId, shooterName: myName, ts: serverTimestamp(),
      });
      sfxHit();
      hitmarkerEl.classList.remove("show");
      void hitmarkerEl.offsetWidth; // restart animation
      hitmarkerEl.classList.add("show");
    }
  }
}

/* ============================================================
   HEALTH / DEATH / RESPAWN (local player is authoritative over
   its own health — see the incomingHits listener above)
   ============================================================ */
let killsCount = 0; // mirrors player.kills, kept for clarity in UI updates
const killsValEl = document.getElementById("killsVal");
const deathsValEl = document.getElementById("deathsVal");
const healthFill = document.getElementById("healthFill");
const damageFlash = document.getElementById("damageFlash");

function updateHealthUI() {
  const pct = Math.max(0, player.health / player.maxHealth) * 100;
  healthFill.style.width = `${pct}%`;
}
function updateKdUI() {
  killsValEl.textContent = player.kills;
  deathsValEl.textContent = `${player.deaths} death${player.deaths === 1 ? "" : "s"}`;
}

function damagePlayer(amount, shooterName, shooterId) {
  if (!player.alive) return;
  player.health -= amount;
  sfxHurt();
  damageFlash.classList.remove("show");
  void damageFlash.offsetWidth;
  damageFlash.classList.add("show");
  setTimeout(() => damageFlash.classList.remove("show"), 150);
  updateHealthUI();

  if (player.health <= 0) {
    playerDie(shooterName, shooterId);
  } else {
    update(playerRef, { health: player.health });
  }
}

function playerDie(killerName, killerId) {
  player.alive = false;
  player.health = 0;
  player.deaths++;
  updateHealthUI();
  updateKdUI();

  // credit the kill to whoever got the finishing hit
  if (killerId) {
    update(ref(db, `rooms/${ROOM_ID}/players/${killerId}`), { kills: increment(1) });
  }
  update(playerRef, { health: 0, deaths: player.deaths });
  push(ref(db, `rooms/${ROOM_ID}/killfeed`), {
    fraggerName: killerName || "Someone", fraggedName: myName, ts: serverTimestamp(),
  });

  controls.unlock();
  const h1 = overlay.querySelector("h1");
  h1.textContent = `ELIMINATED by ${killerName || "someone"}`;
  startBtn.textContent = "RESPAWN";
  overlay.classList.remove("hidden");
}

function respawnPlayer() {
  player.alive = true;
  player.health = player.maxHealth;
  updateHealthUI();
  camera.position.copy(randomSpawnPoint()).setY(PLAYER_HEIGHT);
  player.velocity.set(0, 0, 0);
  weapon.mag = weapon.magSize;
  updateAmmoUI();
  update(playerRef, {
    x: camera.position.x, y: camera.position.y, z: camera.position.z,
    health: player.health, name: myName,
  });
  overlay.querySelector("h1").textContent = "ARENA PVP";
  startBtn.textContent = "START";
}

controls.addEventListener("lock", () => {
  if (!player.alive) respawnPlayer();
});

/* ============================================================
   COLLISION HELPERS (simple circle-vs-AABB in XZ plane)
   ============================================================ */
function resolveObstacleCollision(pos, radius) {
  for (const ob of obstacles) {
    const dx = pos.x - ob.x;
    const dz = pos.z - ob.z;
    const overlapX = ob.halfW + radius - Math.abs(dx);
    const overlapZ = ob.halfD + radius - Math.abs(dz);
    if (overlapX > 0 && overlapZ > 0) {
      if (overlapX < overlapZ) {
        pos.x += Math.sign(dx) * overlapX;
      } else {
        pos.z += Math.sign(dz) * overlapZ;
      }
    }
  }
  const half = ARENA_SIZE / 2 - 1;
  pos.x = Math.max(-half, Math.min(half, pos.x));
  pos.z = Math.max(-half, Math.min(half, pos.z));
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  if (controls.isLocked && player.alive) {
    const dir = new THREE.Vector3();
    const forwardInput = (move.forward ? 1 : 0) - (move.back ? 1 : 0);
    const rightInput = (move.right ? 1 : 0) - (move.left ? 1 : 0);

    dir.set(rightInput, 0, -forwardInput);
    if (dir.lengthSq() > 0) dir.normalize();

    const forwardVec = new THREE.Vector3();
    camera.getWorldDirection(forwardVec);
    forwardVec.y = 0;
    forwardVec.normalize();
    const rightVec = new THREE.Vector3().crossVectors(forwardVec, camera.up).normalize();

    const moveVec = new THREE.Vector3();
    moveVec.addScaledVector(forwardVec, -dir.z);
    moveVec.addScaledVector(rightVec, dir.x);
    if (moveVec.lengthSq() > 0) moveVec.normalize();

    const newPos = camera.position.clone();
    const speed = currentMoveSpeed();
    newPos.x += moveVec.x * speed * delta;
    newPos.z += moveVec.z * speed * delta;
    resolveObstacleCollision(newPos, PLAYER_RADIUS);
    camera.position.x = newPos.x;
    camera.position.z = newPos.z;

    player.velocity.y -= GRAVITY * delta;
    camera.position.y += player.velocity.y * delta;
    if (camera.position.y <= PLAYER_HEIGHT) {
      camera.position.y = PLAYER_HEIGHT;
      player.velocity.y = 0;
      player.onGround = true;
    }

    if (weapon.fireCooldown > 0) weapon.fireCooldown -= delta;
  }

  updateAimDownSights(delta);
  updateMultiplayer(delta);
  renderer.render(scene, camera);
}

updateHealthUI();
updateAmmoUI();
updateKdUI();
animate();
</script>
</body>
</html>
